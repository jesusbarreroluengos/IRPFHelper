spring.application.name=backend

# Puerto dinámico (Render inyecta la variable PORT)
server.port=${PORT:8080}
server.servlet.context-path=/irpfhelper

# Base de datos (configura las variables en Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/irpfhelper}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:RootSQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Correo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:jbarmec@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:jbarmec@gmail.com}
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:4200}
app.verification.token-hours=${APP_VERIFICATION_TOKEN_HOURS:24}

# CORS: URL del frontend desplegado (configura la variable en Render)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# URL pública del propio backend (usada por el scheduler de keep-alive en producción)
app.self-url=${APP_SELF_URL:http://localhost:${server.port:8080}}

logging.level.org.springframework.security=WARN
